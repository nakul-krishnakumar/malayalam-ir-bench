[project]
name = "malayalam-ir-bench"
version = "0.1.0"
description = "Benchmarking multilingual models on Malayalam IR datasets"
authors = [
   { name="Nakul Krishnakumar", email="nakulkrishnakumar86@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.9.19"
dependencies = [
    "datasets>=3.6.0",
    "matplotlib>=3.9.4",
    "mlflow>=2.22.1",
    "numpy>=2.0.2",
    "pandas>=2.2.3",
    "pydantic>=2.11.1",
    "pytest>=8.4.0",
    "python-dotenv>=1.1.0",
    "pytrec-eval>=0.5",
    "pyyaml>=6.0.2",
    "scikit-learn>=1.6.1",
    "sentence-transformers>=4.1.0",
    "torch>=2.5.1",
    "torchaudio>=2.5.1",
    "torchvision>=0.20.1",
    "tqdm>=4.67.1",
    "transformers>=4.52.4",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
]
