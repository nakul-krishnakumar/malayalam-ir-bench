# Models to benchmark
models:
  multilingual_e5:
    - name: "intfloat/multilingual-e5-base"
      alias: "mE5-base"
      batch_size: 32
      max_seq_length: 512
      cache_folder: "./models/cache/intfloat/multilingual-e5-base"
    - name: "intfloat/multilingual-e5-large"
      alias: "mE5-large" 
      batch_size: 16  # Smaller batch for large model
      max_seq_length: 512
      cache_folder: "./models/cache/intfloat/multilingual-e5-large"
      
  bge_models:
    - name: "BAAI/bge-m3"
      alias: "mBGE-M3"
      batch_size: 32
      max_seq_length: 8192  # BGE-M3 supports longer sequences
      
  sentence_transformers:
    - name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
      alias: "paraphrase-multilingual"
      batch_size: 64  # Smaller model, larger batch
      max_seq_length: 384