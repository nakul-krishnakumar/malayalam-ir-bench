#Malayalam IR Benchmark Configuration

# Project Information
project:
  name: "Malayalam-IR-Benchmark"
  description: "Benchmarking multilingual models on Malayalam IR tasks"

# MLflow Configuration
mlflow:
  experiment_name: "malayalam_ir_bench"
  tracking_uri: "mlruns"  # Local tracking
  log_models: true
  log_artifacts: true

# Datasets
datasets:
  location:
  - path: "./datasets"

  primary:
    name: "Bharat_NanoMSMARCO"
    link: "https://huggingface.co/datasets/carlfeynman/Bharat_NanoMSMARCO_ml"
    corpus_link: "hf://datasets/carlfeynman/Bharat_NanoMSMARCO_ml/corpus/train-00000-of-00001.parquet"
    queries_link: "hf://datasets/carlfeynman/Bharat_NanoMSMARCO_ml/queries/train-00000-of-00001.parquet"
    qrels_link: "hf://datasets/carlfeynman/Bharat_NanoMSMARCO_ml/qrels/train-00000-of-00001.parquet"
    language: "malayalam"
    
  # For future projects
  translated:
    name: "BEIR_Malayalam_Translated"
    link: "../datasets/BEIR_Malayalam/"
    enabled: false  # Enable for Project 3
    
  synthetic:
    name: "Malayalam_Synthetic_Queries"
    link: "../datasets/Synthetic_Malayalam/"
    enabled: false  # Enable for Project 4

# Evaluation Configuration
evaluation:
  # Metrics to compute
  metrics:
    - "recall@5"
    - "recall@10" 
    - "ndcg@5"
    - "ndcg@10"
    - "mrr@10"  # Mean Reciprocal Rank
    - "map@10"  # Mean Average Precision
  
  # Retrieval settings
  top_k: 100  # Retrieve top-100 for evaluation
  
  # Embedding settings
  normalize_embeddings: true
  similarity_function: "cosine"  # cosine, dot_product

# Output Configuration
output:
  results_dir: "../results/"
  save_embeddings: false  # Set true if you want to cache embeddings
  save_detailed_results: true
  export_formats: ["csv", "json"]

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  log_file: "../logs/benchmark.log"
  
# Experiment Configuration
experiment:
  # Run specific models (leave empty to run all)
  run_only: []  # e.g., ["mE5-base", "mBGE-M3"]
  
  # Skip models (useful for resuming experiments)
  skip_models: []  # e.g., ["paraphrase-multilingual"]
  
  # Reproducibility
  random_seed: 42
  
  # Performance
  enable_progress_bar: true
  save_intermediate_results: true